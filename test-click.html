<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click Test</title>
    <style>
        body {
            padding: 40px;
            font-family: Arial, sans-serif;
        }
        .test-button {
            padding: 20px 40px;
            background: #B8975A;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 18px;
            margin: 10px;
        }
        .result {
            margin-top: 20px;
            padding: 20px;
            background: #f5f5f5;
            min-height: 100px;
        }
    </style>
</head>
<body>
    <h1>Album Click Test</h1>
    
    <button class="test-button" onclick="testDirect()">Test 1: Direct openAlbum()</button>
    <button class="test-button" onclick="testClick()">Test 2: Simulate Click</button>
    <button class="test-button" onclick="testSetup()">Test 3: Setup Handler</button>
    
    <div class="result" id="result">Results will appear here...</div>
    
    <!-- Copy main.js content -->
    <script src="js/main.js"></script>
    
    <script>
        function log(msg) {
            const result = document.getElementById('result');
            result.innerHTML += msg + '<br>';
            console.log(msg);
        }
        
        function testDirect() {
            log('=== TEST 1: Direct Call ===');
            log('albumsData exists: ' + (typeof albumsData !== 'undefined'));
            log('openAlbum exists: ' + (typeof openAlbum === 'function'));
            log('Calling openAlbum("yaeyama")...');
            openAlbum('yaeyama');
        }
        
        function testClick() {
            log('=== TEST 2: Simulate Click ===');
            const cover = document.querySelector('.album-cover');
            log('Found .album-cover: ' + (cover !== null));
            if (cover) {
                cover.click();
            }
        }
        
        function testSetup() {
            log('=== TEST 3: Setup Handler ===');
            log('setupAlbumClickHandlers exists: ' + (typeof setupAlbumClickHandlers === 'function'));
            if (typeof setupAlbumClickHandlers === 'function') {
                setupAlbumClickHandlers();
                log('Handler setup complete. Try clicking an album.');
            }
        }
    </script>
</body>
</html>
